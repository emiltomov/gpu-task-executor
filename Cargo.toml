[package]
name = "gpu-task-executor"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gtu"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
nvml-wrapper = "0.13.0"
pollster = "1.0.1"
rand = "0.10.3"
ratatui = "0.30.2"
wgpu = "30.0.1"
